<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Fun Facts</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .fact-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 10px;
            margin: 20px 0;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            line-height: 1.6;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .fact-text {
            font-weight: 500;
        }

        .button-container {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            background-color: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1em;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        button:hover {
            background-color: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .counter {
            color: #667eea;
            font-size: 0.9em;
            margin-top: 20px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎉 Fun Facts 🎉</h1>
        <div class="fact-box">
            <p class="fact-text" id="factText">Click the button to get a fun fact!</p>
        </div>
        <div class="button-container">
            <button onclick="getRandomFact()">Get New Fact</button>
            <button onclick="location.reload()">Reset</button>
        </div>
        <div class="counter">
            <p>Facts viewed: <span id="factCount">0</span></p>
        </div>
    </div>

    <script>
        const facts = [
            "Honey never spoils. Archaeologists have found 3,000-year-old honey in Egyptian tombs that was still edible!",
            "A group of flamingos is called a 'flamboyance'.",
            "Octopuses have three hearts: two pump blood to the gills, and one pumps blood to the rest of the body.",
            "Bananas are berries, but strawberries aren't!",
            "A day on Venus is longer than its year.",
            "Wombats produce cube-shaped poop to prevent it from rolling away.",
            "Penguins propose to their mates with a pebble.",
            "Scotland's national animal is a unicorn.",
            "Cleopatra lived closer to the invention of the iPhone than to the construction of the Great Pyramid.",
            "Butterflies taste with their feet.",
            "A group of crows is called a 'murder'.",
            "Dolphins have names for each other.",
            "The smell of petrichor (rain on dry soil) comes from bacteria called actinomycetes.",
            "Cats have over 20 different vocal sounds.",
            "A shrimp's heart is in its head.",
            "The shortest war in history lasted 38 to 45 minutes.",
            "Honey bees communicate by dancing.",
            "Koalas have fingerprints almost identical to humans.",
            "Polar bears are left-handed.",
            "A group of owls is called a 'parliament'.",
            "Lightning strikes the same spot multiple times—the Empire State Building gets hit about 20 times per year.",
            "Cucumbers are 96% water.",
            "The Eiffel Tower can be 15 cm taller during the summer heat.",
            "A cockroach can live for a week without its head.",
            "Starfish don't have brains.",
            "Venus is the only planet that rotates clockwise.",
            "Sloths only defecate once a week.",
            "The Great Wall of China isn't visible from space with the naked eye.",
            "Puffins can fly up to 55 mph.",
            "Cats spend 70% of their lives sleeping."
        ];

        let factCount = 0;

        function getRandomFact() {
            const randomIndex = Math.floor(Math.random() * facts.length);
            const randomFact = facts[randomIndex];
            document.getElementById('factText').textContent = randomFact;
            factCount++;
            document.getElementById('factCount').textContent = factCount;
        }

        // Display initial fact on page load
        window.onload = function() {
            getRandomFact();
        };
    </script>
</body>
</html>
